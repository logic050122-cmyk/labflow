name: Validate and export source ZIP

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Run frontend typecheck
        working-directory: web
        run: npm run typecheck

      - name: Run frontend production build
        working-directory: web
        run: npm run build

      - name: Create source ZIP
        run: |
          rm -rf .git
          rm -rf web/node_modules web/dist
          rm -f .github/workflows/export-source.yml
          zip -r labflow-branch-source.zip . -x "labflow-branch-source.zip"

      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: labflow-branch-source
          path: labflow-branch-source.zip
          if-no-files-found: error
