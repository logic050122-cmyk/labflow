name: Modules 7 and 8 Verify

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      JWT_SECRET: modules-7-8-test-secret
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: labflow
      DB_CONNECTION_LIMIT: 10
      VERIFY_INIT_SCHEMA: 1
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: labflow
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Check and build server
        working-directory: server
        run: |
          npm run typecheck
          npm run build

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Check and build web
        working-directory: web
        run: |
          npm run typecheck
          npm run build

      - name: Verify modules 7 and 8
        working-directory: server
        run: npm run verify:modules-7-8
