name: Module 9 PR Verify

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-module-9:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json
      - name: Verify server
        working-directory: server
        env:
          JWT_SECRET: module-9-ci-secret
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: Verify web
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm run build
