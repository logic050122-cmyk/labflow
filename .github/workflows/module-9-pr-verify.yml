name: Module 9 PR Verify

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-module-9:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      JWT_SECRET: module-9-ci-secret
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: labflow
      DB_CONNECTION_LIMIT: 10
      VERIFY_INIT_SCHEMA: 1
      VERIFY_PORT: 3109
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: labflow
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json
      - name: Verify server and file API
        working-directory: server
        run: |
          npm ci
          npm run typecheck
          npm run build
          node scripts/verify-module-9.mjs
      - name: Verify web
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm run build
