name: Module 8 Owner UI Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  browser-check:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      PORT: 3000
      JWT_SECRET: module-8-owner-ui-secret
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: labflow
      DB_CONNECTION_LIMIT: 10
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: labflow
        ports: [3306:3306]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json

      - name: Install and build
        run: |
          cd server
          npm ci
          npm run build
          cd ../web
          npm ci
          npm install --no-save @playwright/test@1.54.2
          npx playwright install --with-deps chromium
          npm run build

      - name: Initialize owner scenario
        working-directory: server
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs/promises";
          import mysql from "mysql2/promise";

          const schema = await fs.readFile("migrations/001_initial_schema.sql", "utf8");
          const root = await mysql.createConnection({
            host: "127.0.0.1", user: "root", password: "root", multipleStatements: true
          });
          await root.query(schema);
          await root.end();

          const db = await mysql.createConnection({
            host: "127.0.0.1", user: "root", password: "root", database: "labflow"
          });
          await db.execute(
            `INSERT INTO users (id, username, password_hash, nickname)
             VALUES (1001, 'ui_owner', 'unused', '林致远'),
                    (1002, 'ui_member', 'unused', '周雨桐')`
          );
          await db.execute(
            `INSERT INTO projects
              (id, name, description, owner_user_id, status, start_date, end_date, invite_code)
             VALUES (2001, '学生实训项目9', '完成任务达到实训目的', 1001, 'active',
                     '2026-07-20', '2026-07-28', 'OWNERUICHECK')`
          );
          await db.execute(
            `INSERT INTO project_members (project_id, user_id, role)
             VALUES (2001, 1001, 'owner'), (2001, 1002, 'member')`
          );
          await db.execute(
            `INSERT INTO tasks
              (id, project_id, title, description, assignee_user_id, creator_user_id,
               priority, status, tag, due_at, submit_content, submitted_at,
               reviewer_user_id, reviewed_at, completed_at)
             VALUES (3001, 2001, '校验', 'ss', 1002, 1001, 'medium', 'done', '功能',
                     '2026-07-29 00:00:00', 'ss', '2026-07-25 15:02:55', 1001,
                     '2026-07-25 15:03:08', '2026-07-25 15:03:08')`
          );
          await db.execute(
            `INSERT INTO task_comments (id, task_id, user_id, content)
             VALUES (4001, 3001, 1002, '7785623')`
          );
          await db.end();
          NODE

          TOKEN=$(node -e "console.log(require('jsonwebtoken').sign({userId:1001}, process.env.JWT_SECRET, {algorithm:'HS256', expiresIn:3600}))")
          echo "OWNER_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "PROJECT_ID=2001" >> "$GITHUB_ENV"

      - name: Start applications
        run: |
          cd server
          nohup node dist/server.js > /tmp/server.log 2>&1 &
          echo $! > /tmp/server.pid
          cd ../web
          nohup npm run dev -- --host 127.0.0.1 > /tmp/web.log 2>&1 &
          echo $! > /tmp/web.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/server.log /tmp/web.log
          exit 1

      - name: Check Owner UI
        working-directory: web
        run: |
          cp ../.github/scripts/module8-owner-ui-check.mjs ./owner-ui-check.mjs
          node owner-ui-check.mjs
          cat owner-ui-result.json

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: module-8-owner-ui-evidence
          path: |
            web/owner-dialog-900x900.png
            web/owner-ui-result.json

      - name: Stop applications
        if: always()
        run: |
          cat /tmp/server.log || true
          cat /tmp/web.log || true
          kill "$(cat /tmp/server.pid)" || true
          kill "$(cat /tmp/web.pid)" || true
