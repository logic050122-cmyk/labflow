name: Module 9 Build

on:
  push:
    branches:
      - module-9-file-upload

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[module9-generated]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: module-9-file-upload
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json

      - name: Apply module 9 changes
        run: python .github/module-9-apply.py

      - name: Update server lockfile
        working-directory: server
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify server
        working-directory: server
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Verify web
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server web docs
          git commit -m "实现模块九文件上传 [module9-generated]"
          git push origin module-9-file-upload
