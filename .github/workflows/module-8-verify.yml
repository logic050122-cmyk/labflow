name: Module 8 Verify

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      PORT: 3000
      JWT_SECRET: module-8-test-secret
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: labflow
      DB_CONNECTION_LIMIT: 10
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: labflow
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Check server types
        working-directory: server
        run: npm run typecheck

      - name: Build server
        working-directory: server
        run: npm run build

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Check web types
        working-directory: web
        run: npm run typecheck

      - name: Build web
        working-directory: web
        run: npm run build

      - name: Initialize test database
        working-directory: server
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs/promises";
          import mysql from "mysql2/promise";

          const sql = await fs.readFile("migrations/001_initial_schema.sql", "utf8");
          const connection = await mysql.createConnection({
            host: process.env.DB_HOST,
            port: Number(process.env.DB_PORT),
            user: process.env.DB_USER,
            password: process.env.DB_PASSWORD,
            multipleStatements: true
          });

          await connection.query(sql);
          await connection.end();
          NODE

      - name: Start server
        working-directory: server
        run: |
          nohup node dist/server.js > /tmp/labflow-server.log 2>&1 &
          echo $! > /tmp/labflow-server.pid

          for attempt in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/api/auth/me || true)
            if [ "$status" = "401" ]; then
              exit 0
            fi
            sleep 1
          done

          cat /tmp/labflow-server.log
          exit 1

      - name: Run module 8 API acceptance
        working-directory: server
        run: |
          node --input-type=module <<'NODE'
          import mysql from "mysql2/promise";

          const baseUrl = "http://127.0.0.1:3000/api";

          const assert = (condition, message) => {
            if (!condition) {
              throw new Error(message);
            }
          };

          const request = async (path, options = {}) => {
            const {
              method = "GET",
              body,
              token,
              expectedStatus = 200,
              expectedCode = expectedStatus === 200 ? 0 : undefined
            } = options;

            const response = await fetch(`${baseUrl}${path}`, {
              method,
              headers: {
                ...(body ? { "Content-Type": "application/json" } : {}),
                ...(token ? { Authorization: `Bearer ${token}` } : {})
              },
              body: body ? JSON.stringify(body) : undefined
            });

            const payload = await response.json();
            assert(
              response.status === expectedStatus,
              `${method} ${path} expected HTTP ${expectedStatus}, got ${response.status}: ${JSON.stringify(payload)}`
            );

            if (expectedCode !== undefined) {
              assert(
                payload.code === expectedCode,
                `${method} ${path} expected code ${expectedCode}, got ${payload.code}`
              );
            }

            return payload;
          };

          const users = [
            { username: "module8_owner", nickname: "评论项目负责人" },
            { username: "module8_member", nickname: "评论项目成员" },
            { username: "module8_outsider", nickname: "项目外用户" }
          ];

          for (const user of users) {
            await request("/auth/register", {
              method: "POST",
              body: { ...user, password: "Module8Pass!" }
            });
          }

          const login = async (username) => {
            const payload = await request("/auth/login", {
              method: "POST",
              body: { username, password: "Module8Pass!" }
            });
            return payload.data.token;
          };

          const ownerToken = await login("module8_owner");
          const memberToken = await login("module8_member");
          const outsiderToken = await login("module8_outsider");

          const ownerMe = await request("/auth/me", { token: ownerToken });
          const memberMe = await request("/auth/me", { token: memberToken });

          const connection = await mysql.createConnection({
            host: process.env.DB_HOST,
            port: Number(process.env.DB_PORT),
            user: process.env.DB_USER,
            password: process.env.DB_PASSWORD,
            database: process.env.DB_NAME
          });

          const [projectResult] = await connection.execute(
            `INSERT INTO projects
              (name, description, owner_user_id, status, start_date, end_date, invite_code)
             VALUES (?, ?, ?, 'active', '2026-07-01', '2026-08-31', ?)`,
            ["模块八评论验收项目", "用于评论接口真实业务验收", ownerMe.data.user.id, "MODULE8VERIFY"]
          );
          const projectId = Number(projectResult.insertId);

          await connection.execute(
            `INSERT INTO project_members (project_id, user_id, role) VALUES (?, ?, 'owner')`,
            [projectId, ownerMe.data.user.id]
          );
          await connection.execute(
            `INSERT INTO project_members (project_id, user_id, role) VALUES (?, ?, 'member')`,
            [projectId, memberMe.data.user.id]
          );

          const [taskResult] = await connection.execute(
            `INSERT INTO tasks
              (project_id, title, description, assignee_user_id, creator_user_id, priority, status)
             VALUES (?, ?, ?, ?, ?, 'medium', 'doing')`,
            [
              projectId,
              "模块八评论验收任务",
              "用于验证评论查看、新增、删除和权限",
              memberMe.data.user.id,
              ownerMe.data.user.id
            ]
          );
          const taskId = Number(taskResult.insertId);

          const emptyList = await request(`/tasks/${taskId}/comments`, { token: memberToken });
          assert(Array.isArray(emptyList.data.comments), "评论列表必须返回 comments 数组");
          assert(emptyList.data.comments.length === 0, "新任务评论列表应为空");

          await request(`/tasks/${taskId}/comments`, {
            method: "GET",
            token: outsiderToken,
            expectedStatus: 404,
            expectedCode: 40401
          });

          await request(`/tasks/${taskId}/comments`, {
            method: "POST",
            token: memberToken,
            body: { content: "   " },
            expectedStatus: 400,
            expectedCode: 40001
          });

          const created = await request(`/tasks/${taskId}/comments`, {
            method: "POST",
            token: memberToken,
            body: { content: "  已完成评论接口联调。  " }
          });
          const firstComment = created.data.comment;
          assert(firstComment.content === "已完成评论接口联调。", "评论内容应去除首尾空格");
          assert(firstComment.userId === memberMe.data.user.id, "评论人必须来自 JWT 当前用户");
          assert(firstComment.username === "module8_member", "评论应返回 JOIN 查询的 username");
          assert(firstComment.nickname === "评论项目成员", "评论应返回 JOIN 查询的 nickname");

          const ownerList = await request(`/tasks/${taskId}/comments`, { token: ownerToken });
          assert(ownerList.data.comments.length === 1, "Owner 应能查看项目任务评论");

          await request(`/comments/${firstComment.id}`, {
            method: "DELETE",
            token: outsiderToken,
            expectedStatus: 403,
            expectedCode: 40301
          });

          await request(`/comments/${firstComment.id}`, {
            method: "DELETE",
            token: ownerToken
          });

          const afterOwnerDelete = await request(`/tasks/${taskId}/comments`, { token: memberToken });
          assert(afterOwnerDelete.data.comments.length === 0, "Owner 删除后评论列表应为空");

          const archivedCommentResult = await request(`/tasks/${taskId}/comments`, {
            method: "POST",
            token: memberToken,
            body: { content: "归档前保留的历史评论" }
          });
          const archivedComment = archivedCommentResult.data.comment;

          await connection.execute(
            `UPDATE projects SET status = 'archived', archived_at = NOW() WHERE id = ?`,
            [projectId]
          );

          await request(`/tasks/${taskId}/comments`, {
            method: "POST",
            token: memberToken,
            body: { content: "归档后不能新增" },
            expectedStatus: 409,
            expectedCode: 40904
          });

          const archivedList = await request(`/tasks/${taskId}/comments`, { token: memberToken });
          assert(archivedList.data.comments.length === 1, "归档项目仍应允许查看历史评论");

          await request(`/comments/${archivedComment.id}`, {
            method: "DELETE",
            token: memberToken
          });

          const finalList = await request(`/tasks/${taskId}/comments`, { token: ownerToken });
          assert(finalList.data.comments.length === 0, "评论作者应能删除自己的历史评论");

          await connection.end();
          console.log("Module 8 API acceptance passed.");
          NODE

      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/labflow-server.pid ]; then
            kill "$(cat /tmp/labflow-server.pid)" || true
          fi
          if [ -f /tmp/labflow-server.log ]; then
            cat /tmp/labflow-server.log
          fi

      - name: Update module 8 docs
        if: success() && github.actor != 'github-actions[bot]'
        run: |
          python <<'PY'
          from pathlib import Path

          todo_path = Path("docs/TODO.md")
          todo = todo_path.read_text(encoding="utf-8")
          old_todo = """### 模块 8：评论

          - [ ] 模块完成
          - 开发目标：项目成员在任务下查看和添加评论，支持评论人删除自己的评论，并保留 Owner 管理权限。
          - 涉及后端目录：`server/src/modules/comments`、`server/src/modules/tasks`、`server/src/modules/members`。
          - 涉及前端目录：`web/src/views/ProjectDetailView.vue`、`web/src/api`、`web/src/components`、`web/src/types`。
          - 涉及数据库表：`task_comments`、`tasks`、`project_members`、`users`。
          - 完成标准：评论只属于任务，不做回复树或聊天室；只有项目成员能查看和新增；评论人和项目 Owner 可按规则删除；归档项目不允许新增评论。
          - 是否依赖前一个模块：是；评论依赖任务详情和项目成员权限。
          """.replace("          ", "")
          new_todo = """### 模块 8：评论

          - [x] 模块完成
          - [x] 实现 `GET /api/tasks/:taskId/comments`，仅项目成员可查看任务评论
          - [x] 实现 `POST /api/tasks/:taskId/comments`，评论内容必填并限制为 2000 个字符
          - [x] 实现 `DELETE /api/comments/:commentId`，评论作者和项目 Owner 可删除
          - [x] 任务详情已接入评论列表、发布、删除确认和归档项目只读状态
          - [x] 前后端类型检查和生产构建通过
          - [x] MySQL 真实接口验收覆盖成员隔离、输入校验、作者/Owner 删除权限和归档限制
          - 开发目标：项目成员在任务下查看和添加评论，支持评论人删除自己的评论，并保留 Owner 管理权限。
          - 涉及后端目录：`server/src/modules/comments`、`server/src/modules/tasks`、`server/src/modules/members`。
          - 涉及前端目录：`web/src/views/ProjectDetailView.vue`、`web/src/api`、`web/src/components`、`web/src/types`。
          - 涉及数据库表：`task_comments`、`tasks`、`project_members`、`users`。
          - 完成标准：评论只属于任务，不做回复树或聊天室；只有项目成员能查看和新增；评论人和项目 Owner 可按规则删除；归档项目不允许新增评论。
          - 是否依赖前一个模块：是；评论依赖任务详情和项目成员权限。
          """.replace("          ", "")
          if old_todo not in todo:
              raise SystemExit("TODO module 8 block not found")
          todo_path.write_text(todo.replace(old_todo, new_todo, 1), encoding="utf-8")

          api_path = Path("docs/API.md")
          api = api_path.read_text(encoding="utf-8")
          old_api = "新增评论请求字段：`content`。评论不支持回复树和聊天室功能。"
          new_api = """新增评论请求只接收 `content`，`taskId` 从路径获取，评论人从 JWT 当前用户获取。`content` 去除首尾空格后必须非空，最多 2000 个字符；客户端提交的 `userId`、`projectId` 不参与业务判断。

          `GET /api/tasks/:taskId/comments` 和 `POST /api/tasks/:taskId/comments` 都会先通过任务反查所属项目，并校验当前用户仍是项目成员。评论按 `createdAt`、`id` 升序返回，响应中的每条评论包含 `id`、`taskId`、`userId`、`username`、`nickname`、`content`、`createdAt`、`updatedAt`。

          `DELETE /api/comments/:commentId` 会通过评论反查任务和项目；只有评论作者本人或 `projects.owner_user_id` 对应的项目 Owner 可以删除。归档项目允许查看和按权限删除历史评论，但不允许新增评论。第一版不实现评论回复树、编辑、点赞或聊天室。

          失败规则：路径 ID 或评论内容格式错误返回 `40001`；任务不存在或当前用户不是所属项目成员返回 `40401`；评论不存在返回 `40401`；当前用户既不是评论作者也不是项目 Owner 返回 `40301`；归档项目新增评论返回 `40904`。"""
          if old_api not in api:
              raise SystemExit("API comments summary not found")
          api_path.write_text(api.replace(old_api, new_api, 1), encoding="utf-8")

          log_path = Path("docs/DEV_LOG.md")
          log = log_path.read_text(encoding="utf-8")
          marker = "# 开发日志\n\n本文档按日期记录已经发生的变更，不记录尚未实施的计划。\n"
          section = """

          ## 2026-07-25

          ### 模块 8：任务评论闭环完成

          - 新增 `server/src/modules/comments` 的 routes、controller、service、repository、validator 和 types 分层，提供任务评论列表、新增评论和删除评论接口。
          - 评论查看和新增要求当前用户仍是任务所属项目成员；归档项目保留历史评论查看，但禁止新增评论。
          - 删除权限以评论作者 ID 或 `projects.owner_user_id` 为准，前端按钮显示不代替后端权限校验。
          - 前端新增评论类型、API 封装和独立 `TaskComments.vue`，任务详情支持评论加载、发布、删除确认、错误重试和归档只读提示。
          - GitHub Actions 已通过后端 typecheck/build、前端 typecheck/build，并在 MySQL 8.0 中启动真实后端完成评论接口验收。
          - 真实验收覆盖空列表、成员与非成员隔离、空评论校验、评论人字段、Owner 删除、外部用户拒绝、归档后禁止新增以及历史评论查看和删除。
          - `task_comments` 表已存在，本次未修改数据库迁移；评论通知和操作日志继续留到模块 10、模块 12 接入。
          """.replace("          ", "")
          if marker not in log:
              raise SystemExit("DEV_LOG header not found")
          if "### 模块 8：任务评论闭环完成" not in log:
              log_path.write_text(log.replace(marker, marker + section, 1), encoding="utf-8")
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/API.md docs/DEV_LOG.md docs/TODO.md
          if ! git diff --cached --quiet; then
            git commit -m "docs(comments): record module 8 completion"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
